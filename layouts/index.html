{{ define "main" }}
  <main>
    <h2>Houtsnijwerk Portfolio</h2>
    <div class="grid-container">
      {{ with .Site.GetPage "houtsnijwerk" }}
        {{ range .Resources.ByType "image" }}
          {{ $img := .Fit "200x200" }}
          {{ $largeImg := .Fit "850x850" }}
          <figure>
            <a href="{{ $largeImg.RelPermalink }}">
              <img src="{{ $img.RelPermalink }}"
                   alt="{{ replace (replace .Name ".jpg" "") "-" " " | title }}"
                   loading="lazy">

              <figcaption>
                {{ replace (replace .Name ".jpg" "") "-" " " | title }}
              </figcaption>
            </a>
          </figure>
        {{ end }}
      {{ end }}
    </div>
  </main>
{{ end }}
